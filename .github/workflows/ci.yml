name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  check:
    name: Check (${{ matrix.build.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: default (no gui)
            features: ""
          - name: gui
            features: "--features gui"
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev \
            libgtk-4-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --locked --all-targets ${{ matrix.build.features }}
      - name: cargo test
        run: cargo test --locked ${{ matrix.build.features }}
      - name: cargo clippy
        run: cargo clippy --locked --all-targets ${{ matrix.build.features }} -- -D warnings

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev libgtk-4-dev libpipewire-0.3-dev libpulse-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --features gui
      - name: Smoke test the CLI
        run: |
          ./target/release/pw-duck-smooth --version
          ./target/release/pw-duck-smooth --help
          ./target/release/pw-duck-smooth config --help
      - uses: actions/upload-artifact@v4
        with:
          name: pw-duck-smooth
          path: target/release/pw-duck-smooth

  packaging:
    name: Packaging files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop-file-utils
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - run: desktop-file-validate assets/applications/pw-duck-smooth.desktop
      - run: bash -n PKGBUILD

  aur-release:
    name: AUR release checks
    runs-on: ubuntu-latest
    # The AUR files only carry a real checksum once the release tag exists, so
    # this only guards published tags.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: No SKIP checksum in the AUR files
        run: |
          if grep -R "SKIP" PKGBUILD .SRCINFO; then
            echo "::error::SKIP checksums must not be published; run scripts/update-aur-checksum.sh"; exit 1
          fi

  nix:
    name: Nix flake check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://cache.nixos.org
            extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
      - run: nix flake check --no-build